<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meet</title>
  <meta name="description" content="Find a place that's fair for everyone. The streets flood out from each address and meet in the middle.">
  <meta name="theme-color" content="#f2f2f7">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- ============ Start: the logo and your address ============ -->
  <section id="screen-home" class="screen screen-centered" hidden>
    <div class="intro">
      <div class="wordmark wordmark-xl" role="img" aria-label="Meet">meet<i></i></div>
      <div class="search searchfield" id="home-search">
        <input id="home-input" type="search" placeholder="Where are you starting from?" autocomplete="off" aria-label="Where are you starting from?">
        <button class="field-btn" type="button" id="home-locate" title="Use my current location" aria-label="Use my current location">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20.5 3.5L3.5 10.6l7.3 2.6 2.6 7.3z" fill="currentColor"/></svg>
        </button>
        <ul class="suggestions" role="listbox" hidden></ul>
      </div>
      <button class="btn btn-plain" type="button" id="home-cancel" hidden>Cancel</button>
    </div>
  </section>

  <!-- ============ Main ============ -->
  <section id="screen-main" class="screen" hidden>
    <div id="map" aria-label="Map"></div>

    <header class="topbar">
      <div class="wordmark">meet<i></i></div>
      <div class="topbar-actions">
        <button class="round-btn" id="btn-recenter" title="Show everyone" aria-label="Show everyone">
          <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M20.5 3.5L3.5 10.6l7.3 2.6 2.6 7.3z" fill="var(--accent)"/></svg>
        </button>
        <button class="round-btn" id="btn-menu" title="Menu" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div class="flood-hud" id="flood-hud" aria-live="polite" hidden></div>

    <div class="status-chip" id="search-status" hidden>
      <span class="spinner" aria-hidden="true"></span>
      <span class="status-text">Finding routes…</span>
      <button class="chip-btn" id="btn-skip" hidden>Skip</button>
      <button class="chip-btn" id="btn-cancel-search">Cancel</button>
    </div>

    <aside class="panel" id="panel" aria-live="polite">
      <div class="panel-handle" id="panel-handle" role="button" tabindex="0" aria-label="Drag or tap to resize"><span></span></div>
      <div class="panel-body" id="panel-body"></div>
    </aside>
  </section>

  <!-- ============ Menu ============ -->
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <nav class="drawer" id="drawer" aria-label="Menu" hidden>
    <div class="drawer-head">
      <div class="wordmark wordmark-lg">meet<i></i></div>
      <button class="icon-circle" id="drawer-close" aria-label="Close menu">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="drawer-section">
      <h3>Starting point</h3>
      <div id="drawer-home"></div>
      <button class="btn btn-plain" id="btn-edit-home">Change</button>
    </div>
    <div class="drawer-section">
      <h3>Meeting point</h3>
      <div class="segmented small" id="set-mode">
        <button class="seg" data-value="similar">Similar times</button>
        <button class="seg" data-value="total">Least travel</button>
      </div>
      <p class="footnote" id="mode-hint"></p>
    </div>
    <div class="drawer-section">
      <h3>Default way to travel</h3>
      <div class="segmented small" id="set-travel">
        <button class="seg" data-value="transit">Transit</button>
        <button class="seg" data-value="walk">Walk</button>
        <button class="seg" data-value="bike">Bike</button>
        <button class="seg" data-value="drive">Drive</button>
      </div>
      <p class="footnote">For people you add. Change anyone's from the pill next to their name.</p>
    </div>
    <div class="drawer-section">
      <h3>Animation</h3>
      <div class="segmented small" id="set-speed">
        <button class="seg" data-value="slow">Slow</button>
        <button class="seg" data-value="normal">Normal</button>
        <button class="seg" data-value="fast">Fast</button>
      </div>
    </div>
    <div class="drawer-section">
      <h3>Appearance</h3>
      <div class="segmented small" id="set-theme">
        <button class="seg" data-value="auto">Auto</button>
        <button class="seg" data-value="light">Light</button>
        <button class="seg" data-value="dark">Dark</button>
      </div>
    </div>
    <div class="drawer-section grow">
      <h3>Past meetups</h3>
      <ul class="history" id="history-list"></ul>
    </div>
    <p class="footnote app-note">Everything is saved on this device.</p>
    <p class="footnote app-version" id="app-version" hidden></p>
  </nav>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <noscript><p class="noscript">Meet needs JavaScript to run.</p></noscript>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
